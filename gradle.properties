org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep this app on the classic Android DSL during the SDK / Compose toolchain upgrade.
# Ferrostar is consumed as published AARs; its build DSL does not constrain this setting.
# Migrate the app DSL separately before AGP removes the opt-out.
android.newDsl=false
