org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships a new Android DSL. Ferrostar (our navigation SDK) still builds with the
# classic DSL, so we opt out too and keep both builds identical until the ecosystem
# (and this project) has migrated. Remove this line to switch to the new DSL.
android.newDsl=false
