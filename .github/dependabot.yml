version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Ferrostar and MapLibre Compose move together: the UI modules break at runtime on any other
      # maplibre-compose version, so both are bumped by hand (see gradle/libs.versions.toml).
      # AGP, the Kotlin Compose plugin and the Compose BOM are coordinated manually with
      # compileSdk and validated together, including R8 release builds.
      - dependency-name: "org.maplibre.compose:*"
      - dependency-name: "com.stadiamaps.ferrostar:*"
      - dependency-name: "com.android.application"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "androidx.compose:compose-bom"
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
